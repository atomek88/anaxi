<!doctype html>
<!-- EXPLORATION (throwaway) · Anaxi viewer: how should people see and move through depth-marked design docs?
QUESTION  Which views should `anaxi watch` ship first so a team can (a) triage the design at a glance and (b) read any
          item, or the whole design, at the depth they need, without scrolling forever?
AUDIENCE  the Anaxi author, who likes spatial metaphors (3D stack, city) and wants the docs themselves readable
LAYERS    project → topic → item → level → section (zoom is depth); overlays: status, blocked-by, lifecycle
VIEWS     frame (what kind of problem) · reader overview (triage as text) · reader item page at a depth (read) ·
          superseded page (lifecycle) · topic page (zoom one step) · map 2D / 3D stack / city on the SAME example
          data (glance) · scale test, same seeded projects for all three, flat vs semantic zoom (does it hold?) ·
          glance matrix (which questions each picture answers) · checks
SIMULATE  varies: project size n, semantic zoom on/off, seed · random: synthetic projects (seeded LCG) · compared:
          2D graph, 3D layer stack, city · measured: label space, items hidden behind others, legible items
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anaxi viewer</title>
  <link rel="stylesheet" href="kit/kit.css">
  <script src="kit/vendor/elk.bundled.js"></script>
  <script src="kit/vendor/vega.min.js"></script>
  <script src="kit/vendor/vega-lite.min.js"></script>
  <script src="kit/vendor/vega-embed.min.js"></script>
  <script src="kit/vendor/d3.min.js"></script>
  <script src="kit/vendor/d3-sankey.min.js"></script>
  <script src="kit/vendor/three.min.js"></script>
  <!--VENDOR-->
  <style>
    .ex-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 6px 0 18px; }
    .ex-card { border: 1.5px solid var(--pk-line); border-radius: 14px; padding: 13px 15px; }
    .ex-card h3 { margin: 0 0 5px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--pk-ink-3); }
    .ex-card p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--pk-ink-2); }
    .ex-card.pick { border-color: var(--pk-accent); background: var(--pk-accent-soft); }
    /* the reader */
    .vw { display: grid; grid-template-columns: 190px minmax(0, 1fr) 250px; gap: 22px; font-size: 14px; line-height: 1.55; }
    .vw-crumb { font-size: 12px; color: var(--pk-ink-3); margin-bottom: 6px; }
    .vw-crumb button, .vw-nav button, .vw-rail button, .vw-at { color: var(--pk-accent); font: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
    .vw-nav { font-size: 13px; border-right: 1px solid var(--pk-line); padding-right: 12px; }
    .vw-nav h4, .vw-rail h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--pk-ink-3); }
    .vw-nav .o { display: block; padding: 2px 0; color: var(--pk-ink-2); }
    .vw-nav .o.dim { color: var(--pk-ink-3); opacity: .55; }
    .vw-rail { font-size: 13px; border-left: 1px solid var(--pk-line); padding-left: 12px; }
    .vw-rail .n { margin: 4px 0; }
    .vw-rail .o { display: block; padding: 1px 0; color: var(--pk-ink-2); } .vw-rail .o.dim { opacity: .5; }
    .vw-main h1 { margin: 0 0 4px; font-size: 24px; }
    .vw-badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
    .vw-b { font-size: 12px; border: 1px solid var(--pk-line); border-radius: 999px; padding: 1px 9px; color: var(--pk-ink-2); }
    .vw-b.st-blocked { border-color: var(--pk-bad); color: var(--pk-bad); }
    .vw-b.st-enough { border-color: var(--pk-ok); color: var(--pk-ok); }
    .vw-depth { display: inline-flex; border: 1px solid var(--pk-line); border-radius: 8px; overflow: hidden; margin: 2px 0 10px; }
    .vw-depth button { padding: 3px 10px; font-size: 12px; border: 0; border-right: 1px solid var(--pk-line); background: none; cursor: pointer; color: var(--pk-ink-2); }
    .vw-depth button.on { background: var(--pk-accent); color: #fff; }
    .vw-depth button.past { color: var(--pk-ink-3); text-decoration: line-through; }
    .vw-h { margin: 16px 0 6px; font-size: 16px; }
    .vw-lv { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 5px; background: var(--pk-fill); color: var(--pk-ink-2); vertical-align: 2px; }
    .vw-part { font-size: 11px; color: var(--pk-ink-3); font-weight: 400; }
    .vw-main p { margin: 6px 0; }
    .vw-lvtag { float: right; margin-left: 8px; }
    .vw-hidden { font-size: 12px; color: var(--pk-ink-3); border: 1px dashed var(--pk-line); border-radius: 8px; padding: 6px 10px; margin: 10px 0; }
    .vw-table { border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
    .vw-table td, .vw-table th { border: 1px solid var(--pk-line); padding: 3px 7px; text-align: left; vertical-align: top; }
    .vw-code { background: #22201c; color: #eee; padding: 8px 10px; border-radius: 8px; font-size: 12px; overflow: auto; }
    .vw-list { margin: 4px 0; padding-left: 20px; }
    .vw-check { list-style: none; margin-left: -18px; }
    .vw-check.open { color: var(--pk-bad); }
    .vw-banner { border: 1.5px solid #c9a227; background: #fbf3dc; border-radius: 10px; padding: 9px 12px; margin: 0 0 12px; font-size: 13.5px; }
    .vw-canvas { border-left: 3px solid var(--pk-k-transform, #b39ddb); padding-left: 10px; opacity: .85; }
    .vw-history { border-left: 3px solid #c9a227; padding-left: 10px; opacity: .8; }
    .vw-row { display: grid; grid-template-columns: 26px 200px 90px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--pk-line); font-size: 13px; align-items: baseline; }
    .vw-group { margin: 14px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--pk-ink-3); }
    .vw-pager { display: flex; justify-content: space-between; margin-top: 18px; border-top: 1px solid var(--pk-line); padding-top: 8px; font-size: 13px; }
    .mp-labels { position: relative; }
    .mp-labels .lb { position: absolute; font-size: 11px; transform: translate(-50%, -100%); white-space: nowrap; background: rgba(255,255,255,.8); padding: 0 3px; border-radius: 3px; }
    .gm td.y { color: var(--pk-ok); font-weight: 600; } .gm td.n { color: var(--pk-bad); } .gm td.p { color: #b7791f; }
    .sc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .sc-grid .ex-card b { font-size: 22px; display: block; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<script src="kit/kit.js"></script>
<script>
P.init({
  title: "Anaxi viewer",
  lens: "gedanken",
  question: "Which views should anaxi watch ship first so a team can triage the design at a glance, and read any item or the whole design at the depth they need, without scrolling forever?",
  seed: 7,
  start: "frame",
  model: () => ({ at: null, canvas: false, history: false }),
  capture: { width: 1180, height: 620 },
});
</script>
<script src="kit/graph.js"></script>
<script src="kit/charts.js"></script>
<script src="kit/space.js"></script>
<script src="data.js"></script>
<script src="model.js"></script>
<!--SHAPE-->
<script>
const PR = VM.project(window.ANAXI);
const esc = Kit.esc;
const ICON = { blocked: "⛔", later: "⏸️", trim: "✂️", gap: "⬇️", open: "❓", enough: "🎯", none: "❓", superseded: "↪️", retired: "⏹️", archived: "🗄️" };
const WORD = { blocked: "blocked", later: "later", trim: "over-designed", gap: "go deeper", open: "open questions", enough: "enough", none: "no target", superseded: "superseded", retired: "retired", archived: "archived" };
const COLOR = { blocked: "#c0392b", gap: "#d4870f", trim: "#8e44ad", enough: "#2e8b57", later: "#7f8c8d", open: "#d4870f", none: "#999", superseded: "#b8a46a", retired: "#aaa", archived: "#b8a46a" };
const slugOf = (it) => (it.id ? it.id.slice(1) : it.title.toLowerCase().replace(/[^a-z0-9]+/g, "-"));
const name = (it) => it.id || it.title;
const byKey = (k) => PR.byKey.get(k);
const pageOf = (it) => `#/item-${slugOf(it)}`;
const link = (it) => it ? `<button data-pk-hash="${pageOf(it)}">${esc(name(it))}</button>` : "";
// @ids in rendered markdown become in-app links
const linkify = (h) => h.replace(/<a class="vw-at" data-at="(@[\w-]+)">@[\w-]+<\/a>/g, (m, id) => (byKey(id) ? link(byKey(id)) : `<span title="not an item">${id}</span>`));
const ORDER = ["blocked", "gap", "open", "trim", "later", "none", "enough"];

/* ============ 1. FRAME ============ */
P.state("frame", { title: "Framing", group: "Gedanken", render: () => `
  <h1>What kind of problem is "seeing the design"?</h1>
  <p class="pk-lede">${esc(P.cfg.question)}</p>
  <div class="ex-cards">
    <div class="ex-card"><h3>Framing 1 · a picture</h3><p>Pick the most telling image of the project (graph, 3D stack, city). Measures: what you can tell without clicking.</p></div>
    <div class="ex-card"><h3>Framing 2 · a document</h3><p>Render the docs well (badges, links). Measures: how fast you find and read the right section.</p></div>
    <div class="ex-card"><h3>Framing 3 · a reading budget</h3><p>Depth is how much you need to read for a decision. Zoom out = less depth, zoom in = deeper text. Measures: words shown at each depth, items legible at each zoom.</p></div>
    <div class="ex-card pick"><h3>Framing 4 · a glance and a read ✓</h3><p>Two jobs on one model: <b>triage</b> (pre-attentive: ready, blocked by what, gap, over-designed, superseded) and <b>reading at a depth</b> (linked pages, never one endless scroll). A picture is only as good as the reading it leads to. <b>This is the one to model.</b></p></div>
  </div>
  <div class="ex-cards">
    <div class="ex-card"><h3>Core tension</h3><p>Overview density vs readable detail; and a memorable metaphor vs an accurate one (a tall building looks better, but more depth than needed is a smell).</p></div>
    <div class="ex-card"><h3>Invariants</h3><p>Every view shows the checker's statuses, never its own. Each current item appears once per view. Superseded items never count. Deeper never shows less text.</p></div>
    <div class="ex-card"><h3>Extremes</h3><p>1 item: every picture works, a picture adds nothing over the page. 150 items: no flat picture can label them, so the top zoom must group (topics).</p></div>
  </div>
  <button data-pk-hash="#/reader-overview" style="color:var(--pk-accent);font-weight:600">→ the reader</button> ·
  <button data-pk-hash="#/map-2d" style="color:var(--pk-accent);font-weight:600">→ the maps</button> ·
  <button data-pk-hash="#/scale" style="color:var(--pk-accent);font-weight:600">→ the scale test</button>` });

/* ============ 2. THE READER: linked pages over the same model ============ */
const shell = (crumbs, nav, main, rail) => `<div class="vw"><nav class="vw-nav">${nav}</nav><div class="vw-main"><div class="vw-crumb">${crumbs}</div>${main}</div><aside class="vw-rail">${rail}</aside></div>`;
const crumbs = (parts) => parts.map((p) => (p.hash ? `<button data-pk-hash="${p.hash}">${esc(p.label)}</button>` : esc(p.label))).join(" › ");
const topicNav = (active) => {
  const topics = [...new Set(PR.items.map((it) => it.topic))].sort();
  return `<h4>Project</h4><button class="o" data-pk-hash="#/reader-overview">Overview</button><button class="o" data-pk-hash="#/map-2d">Map</button>
    <h4>Topics</h4>${topics.map((t) => `<button class="o" ${t === active ? 'style="font-weight:700"' : ""} data-pk-hash="#/topic-${t}">${esc(t)} · ${PR.items.filter((i) => i.topic === t).length}</button>`).join("")}
    <h4>History</h4>${PR.inactive.map((it) => `<button class="o dim" data-pk-hash="${pageOf(it)}">${ICON[it.status]} ${esc(name(it))}</button>`).join("")}${PR.deleted.map((d) => `<span class="o dim">✕ ${esc(d.id)}</span>`).join("")}`;
};
const row = (it) => `<div class="vw-row"><span>${ICON[it.status]}</span><span>${link(it)} <span style="color:var(--pk-ink-3)">${esc(it.title)}</span></span><span>${esc(it.depth || "—")} → ${esc(it.target || "—")}</span><span>${it.blockedBy.length ? `blocked by ${it.blockedBy.map((k) => link(byKey(k))).join(", ")}` : esc(WORD[it.status])}${it.usedBy.length ? ` · used by ${it.usedBy.map((k) => link(byKey(k))).join(", ")}` : ""}</span></div>`;

P.state("reader-overview", { title: "Reader · project overview", group: "Reader", render: () => {
  const groups = ORDER.map((s) => [s, PR.items.filter((it) => it.status === s)]).filter(([, l]) => l.length);
  const ready = PR.items.filter((it) => it.status === "enough").length;
  const main = `<h1>TaskFlow design</h1>
    <div class="vw-badges"><span class="vw-b">${PR.model.settings.profile} profile</span><span class="vw-b">stage: ${PR.model.settings.stage}</span><span class="vw-b">${PR.items.length} items · ${ready} enough · ${PR.items.filter((i) => i.status === "blocked").length} blocked</span><span class="vw-b">${PR.inactive.length + PR.deleted.length} in history</span></div>
    <p>Sorted by what needs attention first. Each row opens the item's page; nothing here is a copy of the docs.</p>
    ${groups.map(([s, l]) => `<div class="vw-group">${ICON[s]} ${WORD[s]} · ${l.length}</div>${l.map(row).join("")}`).join("")}
    <div class="vw-group">↪️ superseded, retired, deleted</div>
    ${PR.inactive.map((it) => `<div class="vw-row"><span>${ICON[it.status]}</span><span>${link(it)}</span><span>${esc(it.depth)}</span><span>${esc(it.supersededBy ? `superseded by ${it.supersededBy.id}` : "retired")}${it.successor ? ` → ${link(byKey(it.successor))}` : ""}</span></div>`).join("")}
    ${PR.deleted.map((d) => `<div class="vw-row"><span>✕</span><span>${esc(d.id)}</span><span>${esc(d.date || "")}</span><span>deleted: ${esc(d.why || "")} (in git history)</span></div>`).join("")}`;
  const rail = `<h4>Read the whole design</h4><p style="margin:2px 0">One page per item, in <code>uses:</code> order, at one depth: start at ${link(PR.items.find((i) => !i.uses.length))} and follow "next".</p>
    <h4>Nudges</h4>${PR.nudges.filter((n) => n.code !== "N04" && n.severity !== "info").slice(0, 6).map((n) => `<div class="n">${esc(n.code)} ${link(byKey(n.item))}: ${esc(n.message.slice(0, 80))}</div>`).join("")}`;
  return shell(crumbs([{ label: "TaskFlow" }]), topicNav(), main, rail);
} });

// one page per item, in uses: order (what you use first), so "next" reads the design bottom-up, one page at a time
const L = VM.layout(PR.items);
const reading = [...PR.items].sort((a, b) => L.pos.get(a.key).col - L.pos.get(b.key).col || L.topics.indexOf(a.topic) - L.topics.indexOf(b.topic));
function itemPage(it, ctx) {
  const m = ctx.model;
  const dflt = Math.max(VM.lvN(it.depth), 0);
  const at = m.at == null ? dflt : Math.min(m.at, 4);
  const bs = VM.blocks(PR, it);
  const shown = bs.filter((b) => b.kind !== "title" && b.kind !== "mark" && VM.visible(b, at, { canvas: m.canvas, history: m.history }));
  const hidden = bs.filter((b) => b.kind !== "title" && b.kind !== "mark" && !VM.visible(b, at, { canvas: m.canvas, history: m.history }));
  const hiddenLv = [...new Set(hidden.map((b) => b.level))];
  const body = shown.map((b) => {
    const h = linkify(VM.html(b, esc));
    const tag = b.kind !== "heading" && b.lead ? `<span class="vw-lv vw-lvtag lv-${b.level}">${b.level}</span>` : "";
    return b.level === "canvas" ? `<div class="vw-canvas">${h}</div>` : b.level === "history" ? `<div class="vw-history">${h}</div>` : tag + h;
  }).join("");
  const life = it.status === "superseded" || it.status === "archived" || it.status === "retired";
  const banner = life ? `<div class="vw-banner">${ICON[it.status]} <b>${it.supersededBy ? `Superseded by ${esc(it.supersededBy.id)}` : "Retired"}</b>${it.supersededBy?.reason ? `: ${esc(it.supersededBy.reason)}` : it.retired?.reason ? `: ${esc(it.retired.reason)}` : ""}. ${it.successor ? `Read ${link(byKey(it.successor))} instead; this page explains what came before.` : "Kept for its reasoning; it doesn't count."}${it.status === "archived" ? " (archived)" : ""}</div>` : "";
  const depthCtl = `<div class="vw-depth">${VM.LEVELS.map((l, i) => `<button data-act="at:${i}" class="${i === at ? "on" : ""} ${i > (VM.lvN(it.target) >= 0 ? VM.lvN(it.target) : 4) ? "past" : ""}" title="${i > VM.lvN(it.target) ? "beyond the target" : ""}">${l}</button>`).join("")}</div>
    <button data-act="canvas" style="font-size:12px;color:var(--pk-accent);background:none;border:0;cursor:pointer">${m.canvas ? "hide" : "show"} canvas</button>${bs.some((b) => b.level === "history") ? ` · <button data-act="history" style="font-size:12px;color:var(--pk-accent);background:none;border:0;cursor:pointer">${m.history ? "hide" : "show"} decision log</button>` : ""}`;
  const outline = bs.filter((b) => b.kind === "heading" || b.lead).map((b) => {
    const label = b.kind === "heading" ? b.text[0].replace(/`[^`]*`/g, "") : b.text[0].match(/^\*\*([A-Za-z]+)/)[1];
    return `<span class="o ${VM.visible(b, at, { canvas: m.canvas, history: m.history }) ? "" : "dim"}">${b.level ? `<span class="vw-lv">${esc(b.level)}</span> ` : ""}${esc(label)}</span>`;
  }).join("");
  const i = reading.indexOf(it);
  const pager = life ? "" : `<div class="vw-pager"><span>${i > 0 ? `← ${link(reading[i - 1])}` : ""}</span><span style="color:var(--pk-ink-3)">${i + 1} of ${reading.length} · reading at ${VM.LEVELS[at]}</span><span>${i < reading.length - 1 ? `${link(reading[i + 1])} →` : ""}</span></div>`;
  const main = `${banner}<h1>${esc(it.title)}</h1>
    <div class="vw-badges"><span class="vw-b">${esc(name(it))}</span><span class="vw-b st-${it.status}">${ICON[it.status]} ${WORD[it.status]}</span><span class="vw-b">depth ${esc(it.depth || "—")} · target ${esc(it.target || "—")}${it.effective && it.effective !== it.target ? ` (now ${esc(it.effective)})` : ""}</span>${it.risk ? `<span class="vw-b">risk ${it.risk.join("·")}</span>` : ""}<span class="vw-b">${esc(it.file)}:${it.line}</span></div>
    ${depthCtl}${body}
    ${hidden.length ? `<div class="vw-hidden">${hidden.length} block${hidden.length > 1 ? "s" : ""} deeper than ${VM.LEVELS[at]} hidden (${hiddenLv.map((x) => esc(x)).join(", ")}): ${VM.words(hidden)} words. Raise the depth to read them.</div>` : ""}${pager}`;
  const g = it.nudges.filter((n) => n.code !== "N04");
  const rail = `<h4>Status</h4><div class="n">${it.blockedBy.length ? `⛔ blocked by ${it.blockedBy.map((k) => link(byKey(k))).join(", ")}` : `${ICON[it.status]} ${WORD[it.status]}`}</div>
    <h4>Nudges</h4>${g.length ? g.map((n) => `<div class="n"><b>${esc(n.code)}</b> ${esc(n.message)}</div>`).join("") : life ? "<div class='n'>not counted: history</div>" : "<div class='n'>none: designed enough</div>"}
    <h4>Uses</h4>${it.uses.length ? it.uses.map((u) => `<div class="n">${byKey(u.id) ? link(byKey(u.id)) : esc(u.raw)} <span style="color:var(--pk-ink-3)">${esc(u.actual || "")} of ${esc(u.required || "")}</span></div>`).join("") : "<div class='n'>nothing</div>"}
    <h4>Used by</h4>${it.usedBy.length ? it.usedBy.map((k) => `<div class="n">${link(byKey(k))}</div>`).join("") : "<div class='n'>nobody</div>"}
    ${it.parts?.length ? `<h4>Parts (shown inline)</h4>${it.parts.map((p) => `<div class="n">${esc(p.title)} · ${esc(p.file)}</div>`).join("")}` : ""}
    ${(it.supersedes || []).length ? `<h4>Replaced</h4>${it.supersedes.map((s) => `<div class="n">${byKey(s) ? link(byKey(s)) : esc(s)}</div>`).join("")}` : ""}
    <h4>On this page</h4>${outline || "<span class='o dim'>no levelled sections</span>"}`;
  return shell(crumbs([{ label: "TaskFlow", hash: "#/reader-overview" }, { label: it.topic, hash: `#/topic-${it.topic}` }, { label: name(it) }]), topicNav(it.topic), main, rail);
}
for (const it of PR.all) P.state(`item-${slugOf(it)}`, { title: `Reader · ${name(it)}`, group: "Reader", render: (ctx) => itemPage(it, ctx) });
P.action("at", (m, a) => { m.at = +a; });
P.action("canvas", (m) => { m.canvas = !m.canvas; });
P.action("history", (m) => { m.history = !m.history; });
P.fixture("item-recurring-at-d1", "item-recurring", { title: "Reader · @recurring read at D1", model: (m) => ({ ...m, at: 1 }) });
P.fixture("item-task-api-log", "item-task-api", { title: "Reader · @task-api with its decision log", model: (m) => ({ ...m, history: true }) });

for (const t of [...new Set(PR.items.map((it) => it.topic))]) P.state(`topic-${t}`, { title: `Reader · topic ${t}`, group: "Reader", render: () => {
  const mine = PR.items.filter((it) => it.topic === t);
  const outside = [...new Set(mine.flatMap((it) => it.uses.map((u) => u.id)).filter((k) => byKey(k) && byKey(k).topic !== t))];
  const main = `<h1>${esc(t)}</h1><p>${mine.length} item${mine.length > 1 ? "s" : ""}, and what they depend on outside the topic. One step deeper than the project, one step shallower than an item.</p>
    ${ORDER.flatMap((s) => mine.filter((it) => it.status === s)).map(row).join("")}
    <div class="vw-group">depends on, outside ${esc(t)}</div>${outside.length ? outside.map((k) => row(byKey(k))).join("") : "<p>nothing</p>"}`;

} });

P.state("map-city", { title: "Map · city", group: "Maps", render: () => `<h1>City</h1><p style="font-size:13px"><button data-pk-hash="#/map-2d" style="color:var(--pk-accent)">2D</button> · <button data-pk-hash="#/map-3d" style="color:var(--pk-accent)">3D stack</button> · <button data-pk-hash="#/map-city" style="color:var(--pk-accent)">city</button> · <button data-pk-hash="#/scale" style="color:var(--pk-accent)">scale test</button> · <button data-pk-hash="#/glance" style="color:var(--pk-accent)">glance matrix</button> · <button data-pk-hash="#/checks" style="color:var(--pk-accent)">checks</button></p>

    const items = [...PR.items].sort((a, b) => { const pa = L.pos.get(a.key), pb = L.pos.get(b.key); return (pa.col + pa.row) - (pb.col + pb.row); });

P.decision("No 3D layer stack: @recurring is already hidden behind @multi-calendar at 7 items, and at 40 flat it hides 17 of 40 columns with no label readable; depth is already a length in the 2D bar, so height adds nothing.", "made");

P.decision("Readability measured on bounding-box geometry, not pixels or people; a rotatable 3D view could recover some occlusion at the cost of interaction.", "assumed");
P.decision("The glance matrix is a judgment from the renders, not a user test.", "assumed");
P.question("Should the checker emit blocks (section and lead-in levels, line ranges) in the JSON, so the reader never re-parses markdown?", { level: "D3" });
P.question("A topic above ~25 items stops fitting the 2D map too (the curve fades past 150 items): split it by folder or sub-topic, or fall back to the overview list?", { level: "D2" });

P.question("Does the live reload need per-file granularity (SSE with the changed paths) or is a full model refresh fast enough (~0.07 s)?", { level: "D3" });
